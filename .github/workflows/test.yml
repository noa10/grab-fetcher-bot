name: Test

# The repository had no CI at all: .github/workflows/fetch-orders.yml.disabled
# is the order fetcher, not a test gate, so nothing ran `npm test` on a pull
# request. That is how a dependency bump could reach main with zero evidence.
#
# Two jobs, both offline apart from the MongoDB service container:
#
#   test     - the full suite from tests/run.js, against a throwaway MongoDB.
#              The three MongoDB-backed suites skip silently when no database
#              is reachable, so the service container is what makes them
#              actually run.
#   browser  - launches the bot's own browser. `npm test` never opens a
#              browser, so a puppeteer bump that ships a Chrome which cannot
#              launch would otherwise pass every test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the previous run irrelevant.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. Without this block the token inherits the
# repository default (often read/write on contents, packages and more), which is
# what CodeQL's actions/missing-workflow-permissions flags on both jobs below.
# Nothing here pushes, comments or publishes, so read-only is the whole grant.
permissions:
  contents: read

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          # The suite never opens a browser, and the browser job below installs
          # its own Chrome. Skip the ~150 MB download here.
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Run test suite
        env:
          # The suites read TEST_MONGODB_URI and never fall back to
          # MONGODB_URI, so this can only ever be the throwaway container.
          # state-sync calls dropDatabase() on it.
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/grab_fetcher_test
        run: npm test

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.run_number }}
          path: logs/
          retention-days: 3
          if-no-files-found: ignore

  browser:
    name: Browser launch smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Chrome system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-liberation \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libatspi2.0-0 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libwayland-client0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Install Chrome for Testing
        # No version pinned here on purpose: this resolves to whichever Chrome
        # revision the installed puppeteer pins, so it keeps tracking the
        # dependency across bumps.
        run: npx puppeteer browsers install chrome

      - name: Launch the bot's browser
        env:
          HEADLESS_MODE: 'true'
          BROWSER_PROFILE_DIR: ${{ runner.temp }}/browser-profile
        run: npm run test:browser
